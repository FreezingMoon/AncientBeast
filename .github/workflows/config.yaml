name: Build and Configure

on: [push, pull_request]

env:
  BUN_VERSION: '1.4.2'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - name: Use Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - run: bun install --frozen-lockfile
    - name: build
      run: bun run build
      env:
        PUBLIC_PATH: '/AncientBeast/'
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy
        path: deploy

  test:
       runs-on: ubuntu-22.04
       needs: build

       steps:
       - name: Checkout code
         uses: actions/checkout@v2

       - name: Use Bun
         uses: oven-sh/setup-bun@v2
         with:
           bun-version: ${{ env.BUN_VERSION }}

       - name: Install dependencies
         run: bun install --frozen-lockfile

       - name: Lint code
         run: bun run lint

       - name: Build for testing
         run: bun run build

       - name: Run tests
         run: bun run test

        # Headless-engine smoke test: the simulation drives the real engine
        # through NullEngine, so it catches adapter regressions that the unit
        # tests (which use lightweight mocks) cannot.
       - name: Simulation smoke test
         run: bun run simulate
         env:
           SIM_BASELINE: 3
           SIM_VARIANT: 2

  deploy:
    runs-on: ubuntu-22.04
    needs: test
    steps:
    - name: Deploy completed
      run: echo "Deploy completed"
